<nav class="navbar navbar-expand-lg bg-light">
  <div class="container-fluid">
    <a routerLink="/" class="navbar-brand">Recipe Book</a>
    <button
      type="button"
      class="navbar-toggler"
      (click)="collapsed = !collapsed"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse"
      [class.show]="!collapsed"
      (window:resize)="collapsed = true"
    >
      <ul class="navbar-nav me-auto">
        @if (isAuthenticated) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/recipes" routerLinkActive="active"
              >Recipes</a
            >
          </li>
        }
        @if (!isAuthenticated) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/auth" routerLinkActive="active"
              >Authenticate</a
            >
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" routerLink="/shopping" routerLinkActive="active"
            >Shopping List</a
          >
        </li>
      </ul>
      <ul class="navbar-nav">
        @if (isAuthenticated) {
          <li class="nav-item">
            <a class="nav-link" style="cursor: 'pointer'" (click)="onLogout()"
              >Logout</a
            >
          </li>
        }
        @if (isAuthenticated) {
          <li class="nav-item dropdown" appDropdown>
            <a
              class="nav-link dropdown-toggle"
              style="cursor: 'pointer'"
              role="button"
              >Manage</a
            >
            <ul class="dropdown-menu">
              <li>
                <a
                  class="dropdown-item"
                  style="cursor: 'pointer'"
                  (click)="onSaveData()"
                  >Save Data</a
                >
              </li>
              <li>
                <a
                  class="dropdown-item"
                  style="cursor: 'pointer'"
                  (click)="onFetchData()"
                  >Fetch Data</a
                >
              </li>
            </ul>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
