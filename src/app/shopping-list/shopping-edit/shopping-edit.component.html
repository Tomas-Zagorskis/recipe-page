<div class="row">
  <div class="col-12">
    <form (ngSubmit)="onAddItem(f)" #f="ngForm">
      <div class="row">
        <div class="col-sm-5 mb-3">
          <label for="name">Name</label>
          <input
            name="name"
            ngModel
            type="text"
            id="name"
            class="form-control inset-shadow"
            required
          />
        </div>
        <div class="col-sm-2 mb-3">
          <label for="amount">Amount</label>
          <input
            name="amount"
            ngModel
            type="number"
            id="amount"
            class="form-control inset-shadow"
            required
            pattern="^[1-9]+[0-9]*$"
          />
        </div>
      </div>
      <div class="btn-row col-12">
        <button class="btn btn-success" type="submit" [disabled]="!f.valid">
          {{ editMode ? "Update" : "Add" }}
        </button>
        @if (editMode) {
          <button class="btn btn-danger" type="button" (click)="onDelete()">
            Delete
          </button>
        }
        <button class="btn btn-primary" type="button" (click)="onClear()">
          Clear
        </button>
      </div>
    </form>
  </div>
</div>
