<a
  style="cursor: 'pointer'"
  [routerLink]="[index]"
  routerLinkActive="active"
  class="list-group-item clearfix list-item"
>
  <div class="float-start">
    <h4 class="mb-1">{{ recipeItem.name }}</h4>
    <p class="mb-0">{{ recipeItem.description }}</p>
  </div>
  <span class="float-end">
    <img
      [src]="recipeItem.imagePath"
      alt="{{ recipeItem.name }}"
      class="img-fluid"
      style="max-height: 50px"
    />
  </span>
</a>
