@if (!!recipe) {
  <div>
    <div class="row">
      <div class="col-xs-12">
        <img [src]="recipe.imagePath" alt="" class="img-responsive" />
      </div>
    </div>
    <div class="row">
      <div class="col-xs-12">
        <h1>{{ recipe.name }}</h1>
      </div>
    </div>
    <div class="row">
      <div class="col-xs-12">
        <div class="btn-group" appDropdown>
          <button type="button" class="btn btn-primary dropdown-toggle">
            Manage Recipe <span class="caret"></span>
          </button>
          <ul class="dropdown-menu">
            <li>
              <a
                style="cursor: 'pointer'"
                (click)="onAddToShoppingList()"
                >To Shopping List</a
              >
            </li>
            <li>
              <a routerLink="edit" style="cursor: 'pointer'"
                >Edit Recipe</a
              >
            </li>
            <li>
              <a
                routerLink="/recipes"
                style="cursor: 'pointer'"
                (click)="onDeleteRecipe()"
                >Delete Recipe</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="row margin">
      <div class="col-xs-12">{{ recipe.description }}</div>
    </div>
    <div class="row">
      <div class="col-xs-12">
        <ul class="list-group">
          @for (ingredient of recipe.ingredients; track ingredient) {
            <li class="list-group-item">
              {{ ingredient.name }} - {{ ingredient.amount }}
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
}
@if (!recipe) {
  <div>
    <h2>Recipe Not Found</h2>
  </div>
}
